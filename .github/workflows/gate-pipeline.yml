name: gate-pipeline

# Fluxo gate-driven (BPMN-like) com backend OO + SQLite.
# Regra de continuidade: enquanto houver issue aberta de gate, CI com erro ou ausência
# de testes, o fluxo NÃO está concluído — cada execução devolve envelopes JSON
# (id, gate, status 0/1/2/3/4, message, addenda, next_issue, direction) e garante que
# exista exatamente UMA próxima issue indexada com a instrução do que falta.
#
# Event-driven: também dispara quando uma issue é fechada/rotulada → constrói a seguinte.
on:
  push:
    branches: [main, "arena/**"]
    paths-ignore:
      - ".session/**"          # C2: commit [igc-checkpoint] não reexecuta o pipeline
      - ".igc-profile.yml"
      - ".igc-registry.yml"
      - ".ci/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".session/**"          # C2: commit [igc-checkpoint] não reexecuta o pipeline
      - ".igc-profile.yml"
      - ".igc-registry.yml"
      - ".ci/**"
  issues:
    types: [closed, labeled, reopened]
  schedule:
    - cron: "23 */6 * * *"          # varredura de continuidade (UTC)
  workflow_dispatch:
    inputs:
      gate:
        description: "Gate específico (vazio = todos)"
        type: string
        required: false
      online:
        description: "Consultar gh (runs/issues) — recomendado no CI"
        type: boolean
        default: true

permissions:
  contents: write   # C1: commit do checkpoint [igc-checkpoint]
  issues: write
  actions: read

concurrency:
  group: gate-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  PYTHON_VERSION: "3.12"
  STATE: .ci/pipeline-state.json

jobs:
  gates:
    name: Gates determinísticos + continuidade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.run.outputs.status }}
      direction: ${{ steps.run.outputs.direction }}
      next_issue_key: ${{ steps.run.outputs.next_issue_key }}
      next_issue_gate: ${{ steps.run.outputs.next_issue_gate }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install pytest check-jsonschema yamllint "mkdocs-material>=9.5" "mkdocs>=1.6"
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "${PWD}" >> "$GITHUB_PATH"

      - name: Blueprint (auditoria do fluxo)
        run: python -m pipeline.cli blueprint | tee .ci/blueprint.json

      - name: Executa os gates
        id: run
        continue-on-error: true
        env:
          GATE_INPUT: ${{ github.event.inputs.gate }}
        run: |
          set -uo pipefail
          ARGS="--online --trigger ${{ github.event_name }} --run-id ${{ github.run_id }}-${{ github.run_attempt }}"
          if [ -n "${GATE_INPUT:-}" ]; then ARGS="$ARGS --gate ${GATE_INPUT}"; fi
          python -m pipeline.cli run $ARGS --no-exit-code > "$STATE"
          STATUS=$(jq -r '.status' "$STATE")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "direction=$(jq -r '.direction' "$STATE")" >> "$GITHUB_OUTPUT"
          echo "next_issue_key=$(jq -r '.next_issue.key // ""' "$STATE")" >> "$GITHUB_OUTPUT"
          echo "next_issue_gate=$(jq -r '.next_issue.gate // ""' "$STATE")" >> "$GITHUB_OUTPUT"
          echo "message=$(jq -r '.message' "$STATE")" >> "$GITHUB_OUTPUT"
          jq -r '.envelopes[] | [.gate, .status, .direction, .message] | @tsv' "$STATE"

      - name: Publica envelopes (resumo)
        if: always()
        run: |
          {
            echo "## Pipeline gate-driven — status ${{ steps.run.outputs.status }} (${{ steps.run.outputs.direction }})"
            echo
            echo "| Gate | Status | Direção | Mensagem |"
            echo "| --- | --- | --- | --- |"
            jq -r '.envelopes[] | "| `\(.gate)` | \(.status) | \(.direction) | \(.message) |"' "$STATE" 2>/dev/null || true
            echo
            echo "**Próxima issue indexada:** `${{ steps.run.outputs.next_issue_key }}`"
            echo
            echo '```json'
            jq '.next_issue' "$STATE" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Garante a próxima issue (uma única, idempotente)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          STATUS="${{ steps.run.outputs.status }}"
          GATE="${{ steps.run.outputs.next_issue_gate }}"
          KEY="${{ steps.run.outputs.next_issue_key }}"
          if [ "$STATUS" = "0" ]; then
            echo "Todos os gates aprovados — nada a continuar."
            gh issue list --state open --label "pipeline:next" --json number --jq '.[].number' \
              | xargs -r -I{} gh issue close {} --comment "Fluxo gate-driven concluído: todos os gates em status 0."
            exit 0
          fi
          [ -f .ci/next-issue.md ] || { echo "sem instrução gerada"; exit 0; }
          for L in "gate:${GATE}" "pipeline:next" "status:${STATUS}"; do
            gh label create "$L" --color "1D76DB" --description "Pipeline gate-driven" >/dev/null 2>&1 || true
          done
          EXISTING=$(gh issue list --state open --label "gate:${GATE}" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING já cobre o gate '$GATE' — atualizando instruções."
            gh issue comment "$EXISTING" --body-file .ci/next-issue.md
            echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            TITLE=$(jq -r '.next_issue.title' "$STATE")
            NUMBER=$(gh issue create --title "$TITLE" --body-file .ci/next-issue.md \
              --label "gate:${GATE}" --label "pipeline:next" --label "status:${STATUS}")
            echo "Issue criada: $NUMBER (gate=$GATE key=$KEY)"
          fi

      - name: Artefatos (estado, envelopes, instrução)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-state
          path: |
            .ci/pipeline-state.json
            .ci/next-issue.md
            .ci/blueprint.json
            .ci/pipeline.sqlite3
            knowledge/validation.md
          retention-days: 14
          if-no-files-found: warn

      - name: Checkpoint IGC (WAL + CHECKPOINT + registry)
        # IGC v2.1 Art. 8 — C1: nenhum run termina sem memória. C3: falha aqui = job reprovado.
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # D24 (M4): rebase ANTES de escrever memória — o CHECKPOINT é calculado sobre o
          # tip mais recente, então o commit do bot nunca sobrescreve o wal_sha256.
          git config user.name "igc-bot"
          git config user.email "igc-bot@users.noreply.github.com"
          if [ "${GITHUB_EVENT_NAME:-push}" != "pull_request" ]; then
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || echo "::warning::rebase pré-checkpoint falhou"
          fi
          python3 .session/ci_checkpoint.py --run-id "${GITHUB_RUN_ID}" --gate "${GATE_ID:-pipeline}" || true
          rc=${PIPESTATUS[0]:-0}
          if [ "${GITHUB_EVENT_NAME:-push}" = "pull_request" ]; then
            echo "pull_request: checkpoint publicado como artefato (.ci/igc-checkpoint.json)"
          else
            git add -f .session .igc-registry.yml || true
            git add -f .ci/igc-checkpoint.json || true
            git add -f .ci/guardian.json || true
            git add -f .ci/actionlint.txt || true
            if ! git diff --cached --quiet; then
              git commit -m "igc(ci): run ${GITHUB_RUN_ID} [igc-checkpoint]" || true
              git push origin "HEAD:${GITHUB_REF_NAME}" || {
                git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
                git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::push do checkpoint falhou (DEBT)"
              }
            fi
          fi
          # C3: a falha do step de WAL reprova o gate (E2)
          python3 - <<'PYCHK'
          import json, pathlib, sys
          f = pathlib.Path(".ci/igc-checkpoint.json")
          if not f.exists():
              print("::error::checkpoint IGC ausente (C1/C3)"); sys.exit(1)
          env = json.loads(f.read_text(encoding="utf-8"))
          if int(env.get("status", 1)) != 0:
              print(f"::error::checkpoint IGC reprovado: {env.get('message')}"); sys.exit(1)
          print(f"checkpoint IGC ok: {env.get('checkpoint_ref','')[:12]} wal={env.get('wal_hash')}")
          PYCHK
          chk=$?
          [ "${chk}" -ne 0 ] && exit 1
          exit "${rc}"

      - name: Gate final (exit code do fluxo)
        if: always()
        run: |
          STATUS="${{ steps.run.outputs.status }}"
          if [ "$STATUS" != "0" ]; then
            echo "::error::Pipeline reprovado (status=$STATUS, direção=${{ steps.run.outputs.direction }}). Instrução da próxima issue: .ci/next-issue.md"
            exit 1
          fi
          echo "Pipeline aprovado: entrega pronta para produção."
