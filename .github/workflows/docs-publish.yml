name: docs-publish

# PRODUÇÃO: publica a base de conhecimento (MkDocs Material) no GitHub Pages.
# Só roda depois do gate `validate` passar (needs: gate reutiliza o mesmo conjunto de checagens
# por meio do workflow validate.yml disparado no mesmo evento + verificação obrigatória de branch).
on:
  push:
    branches: [main]
    paths:
      - "knowledge/**"
      - "skills/**"
      - "mkdocs.yml"
      - "scripts/**"
      - ".github/workflows/docs-publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build do site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install "mkdocs-material>=9.5" "mkdocs>=1.6"

      - name: Validação rápida (bloqueante)
        run: python scripts/validate.py --langs pt,en --report knowledge/validation.md --mkdocs

      - name: Regenera nav, índices e espelho da skill
        run: python scripts/build_site.py

      - name: Build MkDocs (strict)
        run: mkdocs build --strict --site-dir site

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Sobe artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publica no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
