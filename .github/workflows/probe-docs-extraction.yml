name: probe-docs-extraction

on:
  push:
    branches: ["arena/c91bd6a1-github-actions-docs-skill"]
    paths: [".github/workflows/probe-docs-extraction.yml", "scripts/*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Tooling
        run: |
          python3 --version
          pip install --quiet beautifulsoup4 lxml markdownify
          (sudo apt-get update -qq && sudo apt-get install -y -qq pandoc) >/dev/null 2>&1 || true
          pandoc --version 2>/dev/null | head -1 || echo "PANDOC_MISSING"

      - name: Probe
        run: python3 scripts/probe.py > .ci/probe-report.md 2>&1

      - name: Publish report
        run: |
          mkdir -p .ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/probe-report.md
          git commit -q -m "ci(probe): DOM/sitemap/converter diagnostics [skip ci]" || echo "nothing to commit"
          git push -q origin HEAD:arena/c91bd6a1-github-actions-docs-skill
